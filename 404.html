<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · Happy Plate Supper Club</title>
<meta name="theme-color" content="#1D1712">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1D1712; --gild:#E7C090; --gild-hi:#F8E7C6; --gild-lo:#A87F45; --linen:#F3EADC; --muted:#A2907B; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh; background:var(--ink); color:var(--linen);
    font-family:"Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:300;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem; overflow:hidden; position:relative;
  }
  .glow{
    position:fixed; inset:-20vh -20vw; z-index:0; pointer-events:none;
    background:
      radial-gradient(45vw 45vw at 50% 8%, rgba(231,192,144,.13), transparent 70%),
      radial-gradient(60vw 55vw at 88% 72%, rgba(168,127,69,.11), transparent 72%);
  }
  .content{ position:relative; z-index:1; }
  .ring{ width:6rem; height:6rem; margin:0 auto 2rem; }
  .ring circle{ fill:none; stroke:var(--gild); stroke-width:2.2; opacity:.85; }
  .ring text{ font-family:"Italiana", Georgia, serif; font-size:44px; letter-spacing:-3px; fill:var(--gild); }
  .eyebrow{ font-size:.62rem; letter-spacing:.34em; text-transform:uppercase; color:var(--muted); margin:0 0 1rem; }
  h1{
    font-family:"Italiana", Georgia, serif; font-weight:400; font-size:clamp(2.4rem,10vw,3.4rem);
    line-height:1; margin:0 0 1rem;
    background:linear-gradient(168deg, var(--gild-hi), var(--gild) 45%, var(--gild-lo));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p{ color:rgba(243,234,220,.78); max-width:24rem; margin:0 auto 2.25rem; }
  .btn{
    display:inline-block; text-decoration:none;
    font-size:.74rem; font-weight:400; letter-spacing:.22em; text-transform:uppercase;
    padding:1.05rem 2.4rem; border-radius:999px; color:#20180F;
    background:linear-gradient(150deg, var(--gild-hi), var(--gild) 48%, var(--gild-lo));
    box-shadow:0 .8rem 2.4rem -1rem rgba(231,192,144,.6);
    transition:transform .18s ease, box-shadow .3s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 1.1rem 2.8rem -.9rem rgba(231,192,144,.75); }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="content">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52"/>
      <text x="60" y="76" text-anchor="middle">HP</text>
    </svg>
    <p class="eyebrow">Supper Club</p>
    <h1>This seat is empty</h1>
    <p>We couldn't find the page you were looking for — but there's always room at the table.</p>
    <a class="btn" href="./">Back to the table</a>
  </div>
</body>
</html>
